document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er-spacing:.09em;text-transform:uppercase;color:#0f5f52\">Cohab · UI prototype v1<\u002Fdiv>\n<h1 style=\"margin:10px 0 12px;font:600 27px/1.15 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:#14201f;text-wrap:pretty\">Compatibility-based roommate matching, single-campus pilot<\u002Fh1>\n<p style=\"margin:0 0 18px;font:400 14px/1.55 'Instrument Sans',sans-serif;color:#5a6b69;text-wrap:pretty\">Fifteen mobile screens plus one desktop admin screen, laid out as a connected flow. Every button, tab and card links to the screen it would open. Selections, the questionnaire, the PII warning, consent toggles and the moderator queue are live — try them.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:96px 1fr;gap:9px 16px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#14201f;border-top:1px solid #e6e4de;padding-top:16px\">\n<div style=\"color:#8a9795\">Palette<\u002Fdiv><div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\"><span style=\"width:14px;height:14px;border-radius:3px;background:#0f5f52;display:inline-block\"><\u002Fspan>#0f5f52 primary<span style=\"width:14px;height:14px;border-radius:3px;background:#a8442a;display:inline-block;margin-left:6px\"><\u002Fspan>#a8442a divergence<\u002Fdiv>\n<div style=\"color:#8a9795\">Type<\u002Fdiv><div>Instrument Sans · 600 headings, 400/500 body, tabular figures for rent<\u002Fdiv>\n<div style=\"color:#8a9795\">Bands<\u002Fdiv><div>Strong 80+ · Good 65–79 · Fair below 65<\u002Fdiv>\n<div style=\"color:#8a9795\">Photos<\u002Fdiv><div>Drop-zones — drag your own images onto any grey slot; they stick.<\u002Fdiv>\n<div style=\"color:#8a9795\">Paths<\u002Fdiv><div>Screen 2 branches for real: <a href=\"#s3\">has_place → Listing<\u002Fa>, <a href=\"#s4\">needs_place → Questionnaire<\u002Fa>.<\u002Fdiv>\n<div style=\"color:#8a9795\">Exception<\u002Fdiv><div>Screen 13 is desktop by design — moderators work at a desk with evidence side by side, not on a phone.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:340px;background:#f6f5f2;border:1px solid #d9d7d0;border-radius:18px;padding:22px 24px\">\n<div style=\"font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a9795;margin-bottom:12px\">Board key<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:11px;font:400 13px/1.45 'Instrument Sans',sans-serif;color:#14201f\">\n<div><strong style=\"font-weight:600\">Row A · Onboarding<\u002Fstrong><br><span style=\"color:#5a6b69\">Screens 1–6. No persistent nav — a linear flow the user completes once.<\u002Fspan><\u002Fdiv>\n<div><strong style=\"font-weight:600\">Row B · The app<\u002Fstrong><br><span style=\"color:#5a6b69\">Screens 7–12 plus Saved and Profile, all under a four-tab bottom nav.<\u002Fspan><\u002Fdiv>\n<div><strong style=\"font-weight:600\">Row C · Admin<\u002Fstrong><br><span style=\"color:#5a6b69\">Screen 13, internal only, unreachable from the member nav.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #d9d7d0;padding-bottom:12px\">\n<span style=\"font:600 12px/1 'Instrument Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#0f5f52\">Row A<\u002Fspan>\n<span style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;color:#14201f\">Onboarding — screens 1 to 6<\u002Fspan>\n<span style=\"font:400 13px/1.3 'Instrument Sans',sans-serif;color:#8a9795\">Linear, no bottom nav, exits into the match list<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap\">\n\n<div id=\"s0\" style=\"display:flex;flex-direction:column;gap:10px;flex:none;scroll-margin:24px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 7px;background:#14201f;color:#fff;border-radius:4px\">00<\u002Fspan><span style=\"font:600 13px adius:14px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 14px/1.4 'Instrument Sans',sans-serif;color:#5a6b69;margin-bottom:26px\">Didn't get it? <span style=\"color:#8a9795\">Resend in 0:24<\u002Fspan><\u002Fdiv>\n<a href=\"#s2\" style=\"height: 50px; border-radius:30px; background: #0f5f52; color: #fff; font: 600 15px/50px 'Instrument Sans',sans-serif; text-align: center; display: block; text-decoration: none\" style-hover=\"background:#0b4a40\">Verify and continue<\u002Fa>\n<div style=\"margin-top:26px;border-top:1px solid #e6e4de;padding-top:18px\">\n<div style=\"font:600 13px/1.3 'Instrument Sans',sans-serif;color:#14201f;margin-bottom:5px\">Why we verify<\u002Fdiv>\n<div style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#5a6b69;text-wrap:pretty\">Only verified students appear in anyone's matches. Your phone number is not part of verification and is never shown to other members until you both share it.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#8a9795;text-align:center\">Wrong address? <a href=\"#s1\" style=\"color:#0f5f52;font-weight:600\">Change email<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:22px;display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:120px;height:4px;background:#14201f;opacity:.25;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s2\" style=\"display:flex;flex-direction:column;gap:10px;flex:none;scroll-margin:24px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 7px;background:#14201f;color:#fff;border-radius:4px\">02<\u002Fspan><span style=\"font:600 13px/1.2 'Instrument Sans',sans-serif;color:#14201f\">Seeker type<\u002Fspan><span style=\"font:400 12px/1.2 'Instrument Sans',sans-serif;color:#8a9795\">the branch — pick one, the button retargets<\u002Fspan><\u002Fdiv>\n<div style=\"width:36 th already have a place aren't shown to each other.<\u002Fp>\n<button sc-camel-on-click=\"{{ pickNeeds }}\" style=\"text-align:left;border-radius:16px;padding:18px 18px 17px;margin-bottom:14px;cursor:pointer;background:{{ sk.needs.bg }};border:{{ sk.needs.bd }}\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\"><div style=\"font:600 17px/1.25 'Instrument Sans',sans-serif;color:#14201f\">I need a place<\u002Fdiv><div style=\"width:20px;height:20px;border-radius:50%;flex:none;border:{{ sk.needs.dot }};display:flex;align-items:center;justify-content:center\"><div style=\"width:9px;height:9px;border-radius:50%;background:{{ sk.needs.fill }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 14px/1.45 'Instrument Sans',sans-serif;color:#5a6b69;margin-top:6px;text-wrap:pretty\">You're looking for somewhere to live and someone to live with. You'll be matched with others searching, and with people offering a room.<\u002Fdiv>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ pickHas }}\" style=\"text-align:left;border-radius:16px;padding:18px 18px 17px;cursor:pointer;background:{{ sk.has.bg }};border:{{ sk.has.bd }}\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\"><div style=\"font:600 17px/1.25 'Instrument Sans',sans-serif;color:#14201f\">I have a place and need someone<\u002Fdiv><div style=\"width:20px;height:20px;border-radius:50%;flex:none;border:{{ sk.has.dot }};display:flex;align-items:center;justify-content:center\"><div style=\"width:9px;height:9px;border-radius:50%;background:{{ sk.has.fill }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 14px/1.45 'Instrument Sans',sans-serif;color:#5a6b69;margin-top:6px;text-wrap:pretty\">You have a room to fill. You'll add the flat details next, and your rent and move-in date come from that listing.<\u002Fdiv>\n<\u002Fbutton>\n<div style=\"margin-top:22px;padding:14px 15px;background:#f6f5f2;border-radius:14px;font:400 13px/ v style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#3d504d;margin-top:5px\">Aditi Rao · shared 13 Aug, 9:41<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #e6e4de;padding-top:18px\">\n<div style=\"font:600 15px/1.3 'Instrument Sans',sans-serif;color:#14201f;margin-bottom:12px\">Before you meet<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:13px\">\n<div style=\"display:flex;gap:11px\"><div style=\"width:6px;height:6px;border-radius:50%;background:#0f5f52;margin-top:7px;flex:none\"><\u002Fdiv><div style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f;text-wrap:pretty\"><span style=\"font-weight:600\">Meet in a public place first.<\u002Fspan> A café near campus, in daylight, before you see the flat.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:11px\"><div style=\"width:6px;height:6px;border-radius:50%;background:#0f5f52;margin-top:7px;flex:none\"><\u002Fdiv><div style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f;text-wrap:pretty\"><span style=\"font-weight:600\">Tell someone where you're going.<\u002Fspan> Share the address and the time with a friend or family member.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:11px\"><div style=\"width:6px;height:6px;border-radius:50%;background:#0f5f52;margin-top:7px;flex:none\"><\u002Fdiv><div style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f;text-wrap:pretty\"><span style=\"font-weight:600\">See the room in person.<\u002Fspan> Photos are photos. Visit before you commit to anything.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:11px\"><div style=\"width:6px;height:6px;border-radius:50%;background:#0f5f52;margin-top:7px;flex:none\"><\u002Fdiv><div style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f;text-wrap:pretty\"><span style=\"font-weight:600\">Never send a deposit before viewing.<\u002Fspan> No genuine flatmate needs money to hold a room for a day.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:11px\"><div style=\"width:6px;height:6px;border-radius:50%;background:#a8442a;margin-top:7px;flex:none\"><\u002Fdiv><div style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f;text-wrap:pretty\"><span style=\"font-weight:600\">If something feels wrong, leave.<\u002Fspan> You can <a href=\"#s11\" style=\"color:#a8442a;font-weight:600\">report<\u002Fa> or block at any point, before or after sharing.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:none;padding:12px 20px 8px;border-top:1px solid #e6e4de;background:#fff\"><a href=\"#s9\" style=\"display:block;height:48px;border-radius:30px;border:1px solid #cfd3cf;color:#14201f;font:600 15px/46px 'Instrument Sans',sans-serif;text-align:center;text-decoration:none;background:#fff\">Back to chat<\u002Fa><\u002Fdiv>\n<div style=\"height:22px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff\"><div style=\"width:120px;height:4px;background:#14201f;opacity:.25;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s11\" style=\"display:flex;flex-direction:column;gap:10px;flex:none;scroll-margin:24px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 7px;background:#14201f;color:#fff;border-radius:4px\">11<\u002Fspan><span style=\"font:600 13px/1.2 'Instrument Sans',sans-serif;color:#14201f\">Report<\u002Fspan><span style=\"font:400 12px/1.2 'Instrument Sans',sans-serif;color:#8a9795\">live · pick a reason and submit<\u002Fspan><\u002Fdiv>\n<div style=\"width:360px;height:780px;background:#fff;border:1px solid #d9d7d0;border-radius:30px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column\">\n<div style=\"height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 13px/1 'Instrument Sans',sans-serif;color:#14201f;flex:none\"><span>9:41<\u002Fspan><div style=\"display:f dius:50%;flex:none;border:{{ r.dot }}\"><\u002Fdiv>\n<span style=\"font:400 14.5px/1.35 'Instrument Sans',sans-serif;color:#14201f\">{{ r.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:600 13px/1 'Instrument Sans',sans-serif;color:#14201f;margin-bottom:8px\">Details <span style=\"font-weight:400;color:#8a9795\">— optional but useful<\u002Fspan><\u002Fdiv>\n<div style=\"border:1px solid #cfd3cf;border-radius:14px;padding:12px 13px;min-height:110px;font:400 14.5px/1.5 'Instrument Sans',sans-serif;color:#b6bdb9;margin-bottom:16px\">What happened, and when? Anything a moderator should look at.<\u002Fdiv>\n<div style=\"background:#f6f5f2;border-radius:14px;padding:13px 14px;margin-bottom:20px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#5a6b69;text-wrap:pretty\">The last 50 messages in this thread are attached to the report automatically. Nothing else from your profile is shared.<\u002Fdiv>\n<button sc-camel-on-click=\"{{ submitReport }}\" style=\"height:50px;border-radius:30px;border:none;font:600 15px/50px 'Instrument Sans',sans-serif;text-align:center;cursor:pointer;background:{{ reportBtnBg }};color:{{ reportBtnFg }}\">Submit report<\u002Fbutton>\n<a href=\"#s9\" style=\"display:block;text-align:center;font:500 14px/1 'Instrument Sans',sans-serif;color:#5a6b69;padding:16px 0 4px;text-decoration:none\">Block instead, without reporting<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:auto;padding:60px 24px 24px;flex-direction:column;align-items:center;display:{{ reportDoneShow }}\">\n<div style=\"width:52px;height:52px;border-radius:50%;background:#eef4f2;color:#0f5f52;font:600 22px/52px 'Instrument Sans',sans-serif;text-align:center;margin-bottom:20px\">✓<\u002Fdiv>\n<div style=\"font:600 21px/1.3 'Instrument Sans',sans-serif;color:#14201f;text-align:center;margin-bottom:10px\">Report submitted<\u002Fdiv>\n<div style=\"font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#5a6b69;text-align:center;text-wrap:pretty;margin-bottom:24px\">Reference CR-4471. A moderator will review it within 24 hours and you'll be told the outcome by email.<\u002Fdiv>\n<div style=\"width:100%;border:1px solid #e2e0da;border-radius:16px;padding:15px;margin-bottom:20px\"><div style=\"font:600 13.5px/1.3 'Instrument Sans',sans-serif;color:#14201f;margin-bottom:6px\">While we review<\u002Fdiv><div style=\"font:400 13.5px/1.5 'Instrument Sans',sans-serif;color:#5a6b69;text-wrap:pretty\">You can block Aditi now if you'd rather not hear from her. Blocking hides the thread and removes you from each other's matches.<\u002Fdiv><\u002Fdiv>\n<a href=\"#s7\" style=\"width:100%;box-sizing:border-box;height:48px;border-radius:30px;background:#0f5f52;color:#fff;font:600 15px/48px 'Instrument Sans',sans-serif;text-align:center;text-decoration:none\">Block Aditi and go back<\u002Fa>\n<a href=\"#s9\" style=\"display:block;text-align:center;font:500 14px/1 'Instrument Sans',sans-serif;color:#5a6b69;padding:16px 0 4px;text-decoration:none\">Just go back to chat<\u002Fa>\n<\u002Fdiv>\n<div style=\"height:22px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff\"><div style=\"width:120px;height:4px;background:#14201f;opacity:.25;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s12\" style=\"display:flex;flex-direction:column;gap:10px;flex:none;scroll-margin:24px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 7px;background:#14201f;color:#fff;border-radius:4px\">12<\u002Fspan><span style=\"font:600 13px/1.2 'Instrument Sans',sans-serif;color:#14201f\">Outcome feedback<\u002Fspan><span style=\"font:400 12px/1.2 'Instrument Sans',sans-serif;color:#8a9795\">30-day check-in · two questions<\u002Fspan><\u002Fdiv>\n<div style=\"width:360px;height:780px;background:#fff;border:1px solid #d9d7d0;border-radius:30px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-dir ont:400 13.5px/1.5 'Instrument Sans',sans-serif;color:#b6bdb9;margin-bottom:10px\">Finding — what you concluded, kept separately from the sanction.<\u002Fdiv>\n<div style=\"font:400 12.5px/1.5 'Instrument Sans',sans-serif;color:#8a9795;text-wrap:pretty\">Accounts are not suspended while a report is open, except for threats, sexual harassment, or three independent reports.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#8a9795;margin-bottom:11px\">Account<\u002Fdiv>\n<div style=\"border:1px solid #e2e0da;border-radius:14px;padding:14px;font:400 13.5px/1.55 'Instrument Sans',sans-serif;color:#14201f;margin-bottom:20px;text-wrap:pretty\">{{ rep.history }}<\u002Fdiv>\n<div style=\"font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#8a9795;margin-bottom:11px\">Action log<\u002Fdiv>\n<div style=\"border-left:2px solid #e6e4de;padding-left:14px;display:flex;flex-direction:column;gap:14px\">\n<div><div style=\"font:500 13px/1.3 'Instrument Sans',sans-serif;color:#14201f\">Report filed<\u002Fdiv><div style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#8a9795\">13 Aug, 05:22 · reporter<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 13px/1.3 'Instrument Sans',sans-serif;color:#14201f\">Auto-flag: contact solicitation<\u002Fdiv><div style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#8a9795\">12 Aug, 21:16 · system<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 13px/1.3 'Instrument Sans',sans-serif;color:#14201f\">Claimed for review<\u002Fdiv><div style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#8a9795\">13 Aug, 09:05 · S. Nair<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:none;border-top:1px solid #e6e4de;padding:12px 26px;display:flex;align-items:center;gap:12px;background:#fff\">\n<div style=\"height:42px;padding:0 18px;border-radius:14px;backgro ]]}]},\n {n:3,title:'How tidy do you keep shared spaces?',tag:'Cleanliness · similarity',parts:[{k:'clean',opts:[['very_tidy','Cleaned daily, everything put away'],['moderate','Tidy up every few days'],['relaxed','Clean when it needs it']]}]},\n {n:4,title:'How should cleaning get done?',tag:'Chores · similarity',parts:[{k:'chore',opts:[['rota','Fixed rota, everyone knows their job'],['shared','Share fairly, no formal schedule'],['hired','Hire help and split the cost'],['own_mess','Everyone cleans up after themselves only']]}]},\n {n:5,title:'How do you treat things in a shared flat?',tag:'Sharing · tolerance',parts:[{k:'sharing',opts:[['communal','Mostly shared — help yourself'],['ask_first','Ask before using my things'],['separate','I keep my things separate']]}]},\n {n:6,title:'How often do you have guests over?',tag:'Guests · tolerance',parts:[{k:'guest_freq',opts:[['rarely','Rarely'],['occasionally','A few times a month'],['often','Weekly or more'],['partner_regular','A partner stays over regularly']]}]},\n {n:7,title:\"How do you feel about a roommate's guests?\",tag:'Guests · tolerance',parts:[{k:'guest_tol',opts:[['anytime','Fine anytime'],['with_notice','Fine with notice'],['weekends','Weekends only'],['prefer_none',\"I'd rather not\"]]}]},\n {n:8,title:'If something bothered you at home, what would you do?',tag:'Communication · similarity',parts:[{k:'comm',opts:[['direct_now','Say it directly, straight away'],['calm_later','Bring it up calmly at a good moment'],['message','Message rather than talk face to face'],['let_go','Usually let it go']]}]},\n {n:9,title:'How do you handle your share of rent and bills?',tag:'Payment · absolute',sub:'Scored on your answer alone, not on how similar it is to anyone else\\u2019s.',parts:[{k:'pay',opts:[['early',\"Always before it's due\"],['on_time','On time'],['needs_grace','Sometimes need a few days'],['needs_reminding',\"I'd rather someone reminded me\"]]}]},\n {n:10,title:'How should rent and bills be divided?',tag:'Cost split · similarity',parts:[{k:'split',opts:[['equal','Everything split equally'],['by_room','By room size or what each room has'],['by_use','By what each person actually uses'],['flexible','Happy either way']]}]},\n {n:11,title:'Diet and kitchen',tag:'Diet · similarity + tolerance',parts:[{k:'diet',label:'Your diet',opts:[['veg','Vegetarian'],['nonveg','Non-vegetarian'],['eggetarian','Eggetarian'],['vegan','Vegan'],['jain','Jain']]},{k:'nonveg_tol',label:'Non-veg cooking in a shared kitchen',opts:[['fine','No problem'],['prefer_not',\"I'd prefer not\"],['not_at_all','Not at all']]}]},\n {n:12,title:'Smoking and alcohol',tag:'Smoking · tolerance',parts:[{k:'smoke_beh',label:'You',opts:[['none',\"Don't smoke\"],['outside','Smoke, outside only'],['indoors','Smoke indoors']]},{k:'smoke_tol',label:'A roommate who smokes',opts:[['fine','Fine'],['outside_ok','Outside only'],['smoke_free','I want a smoke-free home']]}]}\n];\n\nconst OPTIONAL=[\n {n:13,title:'What are you working towards right now?',k:'life_stage',opts:[['coursework','Coursework and classes'],['exam_prep','Competitive exam preparation'],['job','Working or interning'],['building','Building something of my own'],['research','Research or thesis']]},\n {n:14,title:'Your typical weekday',k:'daytime',opts:[['out','Out most of the day'],['partly','Home part of the day'],['home','Home most of the day']]},\n {n:15,title:'Time at home',k:'home_orientation',opts:[['homebody',\"I'm a homebody\"],['balanced','Balanced'],['rarely',\"I'm barely home\"]]},\n {n:16,title:'What do you want from a flatmate?',k:'sociability',opts:[['friend',\"Someone I'd spend time with\"],['friendly','Friendly, but we live our own lives'],['independent','Polite and independent']]}\n];\n\nconst PRIORITIES=[\n {k:'clean',label:'Cleanliness',sub:'Tidiness of shared spaces'},\n {k:'noise',label:'Noise and sleep',sub:'Quiet hours, calls, music'},\n {k:'guests',label:'Guests',sub:'How often people come over'},\n {k:'pay',label:'Paying on time',sub:'Rent and bills without chasing'},\n {k:'sharing',label:'Sharing things',sub:'Food, belongings, borrowing'},\n {k:'comm',label:'How disagreements are handled',sub:'Saying things vs letting them go'},\n {k:'diet',label:'Food and the kitchen',sub:'Diet and cooking smells'},\n {k:'social',label:'How social the house is',sub:'Company vs independence'}\n];\n\nconst REPORTS=[\n {id:'r-102',name:'Karan V.',reporter:'Priya M.',reason:'Asked for contact details repeatedly',age:'4h',state:'Open',sev:'Standard',evidence:['\"just give me ur number, this chat is annoying\" — 12 Aug, 21:14','\"come on yaar, whatsapp is easier\" — 12 Aug, 21:16','Two PII warnings triggered on this thread in 6 minutes'],history:'No prior reports. Verified 3 Jul 2026. 4 matches, 1 mutual.'},\n {id:'r-101',name:'Sahil R.',reporter:'Two unconnected members',reason:'Abusive language',age:'11h',state:'Open',sev:'Escalated',evidence:['Auto-flag: abusive language, confidence 0.82 — 12 Aug, 14:02','Second report filed by an unconnected member — 12 Aug, 16:40'],history:'One dismissed report in June. Verified 2 Jun 2026.'},\n {id:'r-100',name:'Meera T.',reporter:'Anand K.',reason:'Listing does not match photos',age:'1d',state:'Under review',sev:'Standard',evidence:['Reporter states the room shown is a different flat','Listing edited twice after first response'],history:'No prior reports. Verified 18 May 2026.'},\n {id:'r-098',name:'Devika S.',reporter:'Rahul P.',reason:'Fake or misleading profile',age:'2d',state:'Under review',sev:'Standard',evidence:['Name on institutional email does not match profile name'],history:'Verification record on file. No prior reports.'}\n];\n\nconst PII=/(\\+?\\d[\\d\\s\\-]{7,}\\d)|([A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,})|(@[A-Za-z0-9._]{3,})|(\\b(?:insta|instagram|snap|snapchat|whats?app|telegram)\\b)/i;\n\nclass Component extends DCLogic {\n  state={keep:true,seeker:null,page:0,ans:{},opt:{},prio:[],draft:'',consent:false,reason:null,reported:false,mod:'r-102',fb:{},saved:['m2']};\n\n  set(k,v){ this.setState(s=>({ans:Object.assign({},s.ans,{[k]:v})})); }\n  setOpt(k,v){ this.setState(s=>({opt:Object.assign({},s.opt,{[k]:v})})); }\n  togglePrio(k,max){ this.setState(s=>{ const has=s.prio.indexOf(k)>=0; if(has) return {prio:s.prio.filter(x=>x!==k)}; if(s.prio.length>=max) return {}; return {prio:s.prio.concat([k])}; }); }\n\n  answeredCount(){ return QUESTIONS.filter(q=>q.parts.every(p=>this.state.ans[p.k])).length; }\n\n  renderVals(){\n    const st=this.state, seeker=st.seeker;\n    const keep=st.keep;\n    const MAXP=this.props.maxPriorities ?? 3;\n    const PER=this.props.questionsPerPage ?? 3;\n    const strict=this.props.piiStrict ?? true;\n    const PAGES=Math.ceil(12/PER);\n    const rx=strict?PII:/(\\+?\\d[\\d\\s\\-]{7,}\\d)|([A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,})/i;\n    const KEEP={onKeepLoggedIn:()=>this.setState(s=>({keep:!s.keep})),keepBg:keep?TEAL:'#fff',keepBorder:keep?TEAL:LINE,keepTick:keep?1:0};\n    const chip=(on)=>({bg:on?TEAL_TINT:'#fff',bd:on?'1.5px solid '+TEAL:'1px solid '+LINE,fg:on?TEAL:'#14201f',fw:on?'500':'400'});\n\n    const sk={\n      needs:{bg:seeker==='needs'?TEAL_TINT:'#fff',bd:seeker==='needs'?'1.5px solid '+TEAL:'1px solid '+LINE,dot:seeker==='needs'?'6px solid '+TEAL:'1.5px solid '+LINE,fill:'transparent'},\n      has:{bg:seeker==='has'?TEAL_TINT:'#fff',bd:seeker==='has'?'1.5px solid '+TEAL:'1px solid '+LINE,dot:seeker==='has'?'6px solid '+TEAL:'1.5px solid '+LINE,fill:'transparent'},\n      href:seeker==='has'?'#s3':(seeker==='needs'?'#s4':'#s2'),\n      btnBg:seeker?TEAL:'#e6e4de', btnFg:seeker?'#fff':'#8a9795',\n      btnLabel:seeker==='has'?'Continue — add your listing':(seeker==='needs'?'Continue — 12 quick questions':'Choose one to continue')\n    };\n\n    const start=Math.min(st.page,PAGES-1)*PER;\n    const pageQs=QUESTIONS.slice(start,start+PER).map(q=>({\n      n:'Q'+q.n, title:q.title, tag:q.tag, sub:q.sub||'',\n      parts:q.parts.map(p=>({\n        label:p.label||'', hasLabel:!!p.label,\n        opts:p.opts.map(o=>{ const on=st.ans[p.k]===o[0]; const c=chip(on);\n          return {label:o[1],bg:c.bg,bd:c.bd,fg:c.fg,fw:c.fw,pick:()=>this.set(p.k,o[0])}; })\n      }))\n    }));\n    const done=this.answeredCount();\n\n    const optItems=OPTIONAL.map(q=>({\n      n:'Q'+q.n, title:q.title,\n      opts:q.opts.map(o=>{ const on=st.opt[q.k]===o[0]; const c=chip(on);\n        return {label:o[1],bg:c.bg,bd:c.bd,fg:c.fg,fw:c.fw,pick:()=>this.setOpt(q.k,o[0])}; })\n    }));\n    const optDone=OPTIONAL.filter(q=>st.opt[q.k]).length+(st.opt.interests?1:0)+(st.opt.notes?1:0);\n\n    const prios=PRIORITIES.map(p=>{ const i=st.prio.indexOf(p.k); const on=i>=0;\n      return {label:p.label,sub:p.sub,rank:on?String(i+1):'',bg:on?TEAL_TINT:'#fff',bd:on?'1.5px solid '+TEAL:'1px solid '+LINE,\n        numBg:on?TEAL:'#f2f1ed',numFg:on?'#fff':'#b6bdb9',pick:()=>this.togglePrio(p.k,MAXP)}; });\n\n    const pii=st.draft.length>3&&rx.test(st.draft);\n    const rep=REPORTS.filter(r=>r.id===st.mod)[0]||REPORTS[0];\n\n    const reasons=['They asked for my contact details off-platform','Abusive or threatening language','Fake or misleading profile','The listing is not as described','Spam or promotion','Something else'];\n\n    return {\n      ...KEEP,\n      sk, pickNeeds:()=>this.setState({seeker:'needs'}), pickHas:()=>this.setState({seeker:'has'}),\n\n      pageQs, qDone:done, qPct:Math.round(done/12*100)+'%',\n      qProgress:done+' of 12 answered',\n      qPage:'Questions '+(start+1)+'–'+Math.min(start+PER,12)+' of 12',\n      qBackFn:()=>this.setState({page:Math.max(0,st.page-1)}),\n      qNextFn:()=>this.setState({page:Math.min(PAGES-1,st.page+1)}),\n      qNextHref:st.page>=PAGES-1?'#s5':'#s4',\n      qNextLabel:st.page>=PAGES-1?'Finish — go to the optional part':'Next '+PER+' questions',\n      qBackVis:st.page===0?'hidden':'visible',\n\n      optItems, optDone:optDone+' of 7 answered', optPct:Math.round(optDone/7*100)+'%',\n      optResume:optDone===0?'Nothing answered yet — come back anytime':'Saved. Come back anytime, your place is kept.',\n      pickInterest:(t)=>this.setOpt('interests',t),\n      interests:['Sports and fitness','Music','Gaming','Cooking','Reading','Film and series','Travel','Art and design','Technology','Volunteering','Photography','Outdoors'].map(t=>{ const on=st.opt.interests===t; const c=chip(on); return {label:t,bg:c.bg,bd:c.bd,fg:c.fg,fw:c.fw,pick:()=>this.setOpt('interests',t)}; }),\n\n      prios, prioCount:st.prio.length+' of '+MAXP+' chosen',\n      prioBtnBg:st.prio.length===MAXP?TEAL:'#e6e4de', prioBtnFg:st.prio.length===MAXP?'#fff':'#8a9795',\n      prioBtnLabel:st.prio.length===MAXP?'See my matches':'Pick '+(MAXP-st.prio.length)+' more',\n      prioHref:st.prio.length===MAXP?'#s7':'#s6',\n\n      draft:st.draft, onDraft:(e)=>this.setState({draft:e.target.value}),\n      piiShow:pii?'block':'none', sendBg:pii?'#a8442a':TEAL,\n      clearDraft:()=>this.setState({draft:''}),\n\n      consent:st.consent, toggleConsent:()=>this.setState({consent:!st.consent}),\n      consentBoxBg:st.consent?TEAL:'#fff', consentBoxBd:st.consent?'1.5px solid '+TEAL:'1.5px solid '+LINE,\n      consentTick:st.consent?'visible':'hidden',\n      consentStatus:st.consent?'Both of you have agreed. Numbers are now visible to each other.':'Waiting on you. Aditi agreed 2 hours ago.',\n      contactReveal:st.consent?'block':'none', contactHide:st.consent?'none':'block',\n\n      reasons:reasons.map(r=>{ const on=st.reason===r; return {label:r,bg:on?TEAL_TINT:'#fff',bd:on?'1.5px solid '+TEAL:'1px solid '+LINE,dot:on?'6px solid '+TEAL:'1.5px solid '+LINE,pick:()=>this.setState({reason:r})}; }),\n      reportFormShow:st.reported?'none':'flex', reportDoneShow:st.reported?'flex':'none',\n      submitReport:()=>this.setState({reported:true}),\n      reportBtnBg:st.reason?CLAY:'#e6e4de', reportBtnFg:st.reason?'#fff':'#8a9795',\n\n      reports:REPORTS.map(r=>({id:r.id,name:r.name,reason:r.reason,age:r.age,state:r.state,\n        bg:r.id===st.mod?'#eef4f2':'#fff', bd:r.id===st.mod?'1.5px solid '+TEAL:'1px solid #e2e0da',\n        sevBg:r.sev==='Escalated'?'#f7ece8':'#f2f1ed', sevFg:r.sev==='Escalated'?CLAY:'#5a6b69', sev:r.sev,\n        pick:()=>this.setState({mod:r.id})})),\n      rep:{name:rep.name,reason:rep.reason,reporter:rep.reporter,state:rep.state,id:rep.id.toUpperCase(),history:rep.history,\n        evidence:rep.evidence.map(e=>({t:e}))},\n\n      fb:{\n        still:(v)=>this.setState(s=>({fb:Object.assign({},s.fb,{still:v})})),\n        rate:(v)=>this.setState(s=>({fb:Object.assign({},s.fb,{rate:v})})),\n        opts:[['yes','Yes, still living together'],['no','No, one of us moved out']].map(o=>{ const on=st.fb.still===o[0]; const c=chip(on); return {label:o[1],bg:c.bg,bd:c.bd,fg:c.fg,fw:c.fw,pick:()=>this.setState(s=>({fb:Object.assign({},s.fb,{still:o[0]})}))}; }),\n        scale:[1,2,3,4,5].map(v=>{ const on=st.fb.rate===v; return {label:String(v),bg:on?TEAL:'#fff',fg:on?'#fff':'#14201f',bd:on?'1.5px solid '+TEAL:'1px solid '+LINE,pick:()=>this.setState(s=>({fb:Object.assign({},s.fb,{rate:v})}))}; })\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
