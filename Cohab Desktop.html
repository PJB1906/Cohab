t-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:#0f5f52;text-decoration:none}\n  a:hover{color:#0a473d;text-decoration:underline}\n  input,select,textarea,button{font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif}\n  input::placeholder,textarea::placeholder{color:#9aa5a1}\n  input:focus,textarea:focus,select:focus{outline:2px solid #0f5f52;outline-offset:-1px}\n  ::selection{background:#eef4f2}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;min-width:1220px;background:#eceae5;padding-bottom:74px\">\n\n<sc-if value=\"{{ showNav }}\">\n  <header style=\"position:sticky;top:0;z-index:40;background:#eceae5;border-bottom:1px solid #cfd3cf\">\n    <div style=\"max-width:1360px;margin:0 auto;padding:0 32px;height:60px;display:flex;align-items:center;gap:34px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;margin-right:6px\">\n        <span style=\"font:700 19px/1 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:#0f5f52\">Cohab<\u002Fspan>\n        <span style=\"font:500 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;border:1px solid #cfd3cf;border-radius:3px;padding:3px 5px\">Pilot<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display:flex;align-items:center;gap:26px\">\n        <a href=\"#\" sc-camel-on-click=\"{{ nav.matches }}\" style=\"{{ navStyle.matches }}\">Matches<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ nav.chat }}\" style=\"{{ navStyle.chat }}\">Chat<span style=\"display:inline-block;margin-left:7px;min-width:16px;height:16px;padding:0 4px;border-radius:30px;background:#a8442a;color:#fff;font:600 10px/16px 'Instrument Sans',sans-serif;text-align:center;vertical-align:1px\">1<\u002Fspan><\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ nav.profile }}\" style=\"{{ navStyle.profile }}\">Profile<\u002Fa>\n      <\u002Fnav>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <span style=\"font:400 12px/1 'Instrument Sans',sans-serif;color:#63706d\">{{ campus }}<\u002Fspan>\n      <div style=\"width:30px;height:30px;border-radius:30px;background:#0f5f52;color:#fff;font:600 12px/30px 'Instrument Sans',sans-serif;text-align:center\">PB<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n<\u002Fsc-if>\n\n<!-- 1 · SIGN-UP & VERIFICATION -->\n<sc-if value=\"{{ is1 }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 520px;min-height:100vh\">\n  <div style=\"padding:48px 60px 40px 48px;display:flex;flex-direction:column;border-right:1px solid #cfd3cf;max-width:700px;margin-left:auto;box-sizing:border-box\">\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin:0 0 44px\">\n      <span style=\"font:700 21px/1 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:#0f5f52\">Cohab<\u002Fspan>\n      <span style=\"font:500 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;border:1px solid #cfd3cf;border-radius:3px;padding:3px 5px\">Pilot<\u002Fspan>\n    <\u002Fdiv>\n\n    <h1 style=\"font:600 34px/1.14 'Instrument Sans',sans-serif;letter-spacing:-.02em;margin:0 0 14px;max-width:540px\">Find someone you can actually live with.<\u002Fh1>\n    <p style=\"font:400 16px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 30px;max-width:540px;text-wrap:pretty\">Cohab compares how you sleep, clean, host and pay before it introduces anyone. Every match comes with the reasons behind it — including the one thing you disagree on.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#cfd3cf;border:1px solid #cfd3cf;border-radius:14px;overflow:hidden;margin:0 0 30px\">\n      <sc-for list=\"{{ landingStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:#eceae5;padding:15px 16px\">\n          <span style=\"font:600 22px/1.1 'Instrument Sans',sans-serif;letter-spacing:-.02em;display:block\">{{ s.n }}<\u002Fspan>\n          <span style=\"font:400 12.5px/1.35 'Instrument Sans',sans-serif;color:#63706d;display:block;margin-top:5px\">{{ s.k }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 16px\">How it works<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin:0 0 30px\">\n      <sc-for list=\"{{ landingSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:26px 1fr;gap:14px;align-items:start\">\n          <span style=\"font:600 11px/24px 'Instrument Sans',sans-serif;text-align:center;width:24px;height:24px;border-radius:24px;border:1px solid #cfd3cf;color:#0f5f52;background:#eef4f2\">{{ s.n }}<\u002Fspan>\n          <div>\n            <span style=\"font:600 14.5px/1.3 'Instrument Sans',sans-serif;display:block\">{{ s.t }}<\u002Fspan>\n            <span style=\"font:400 13.5px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;display:block;margin-top:3px;max-width:460px\">{{ s.d }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px\">\n      <sc-for list=\"{{ landingChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <span style=\"border:1px solid #cfd3cf;border-radius:30px;background:#fff;padding:6px 12px;font:500 12px/1.2 'Instrument Sans',sans-serif;color:#3f4d4a\">{{ c }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n    <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:0;max-width:520px;border-top:1px solid #cfd3cf;padding-top:16px\">Matching opens for your locality once enough verified profiles have joined. Cohab never handles rent, deposits or payments.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;padding:64px 56px 56px;display:flex;flex-direction:column\">\n    <sc-if value=\"{{ loginMode }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <h2 style=\"font:600 19px/1.1 'Instrument Sans',sans-serif;margin:0 0 6px\">Log in<\u002Fh2>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 28px\">Use the institutional email you verified with.<\u002Fp>\n\n      <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Institutional email<\u002Flabel>\n      <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"name@msds.christuniversity.in\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;color:#14201f;background:#fff;margin:0 0 18px\">\n\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 7px\">\n        <label style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a\">Password<\u002Flabel>\n        <button style=\"background:none;border:none;padding:0;font:500 12px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">Forgot password?<\u002Fbutton>\n      <\u002Fdiv>\n      <input value=\"{{ password }}\" sc-camel-on-change=\"{{ onPassword }}\" type=\"password\" placeholder=\"••••••••\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;color:#14201f;background:#fff;margin:0 0 16px\">\n\n      <label style=\"display:flex;align-items:center;gap:9px;margin:0 0 24px;font:400 13px/1.3 'Instrument Sans',sans-serif;color:#3f4d4a\"><input type=\"checkbox\" style=\"width:15px;height:15px;accent-color:#0f5f52\">Keep me logged in on this device<\u002Flabel>\n\n      <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"width:100%;background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:13px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Log in<\u002Fbutton>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:26px 0\">\n        <span style=\"height:1px;background:#cfd3cf;flex:1\"><\u002Fspan>\n        <span style=\"font:400 12px/1 'Instrument Sans',sans-serif;color:#9aa5a1\">New to Cohab?<\u002Fspan>\n        <span style=\"height:1px;background:#cfd3cf;flex:1\"><\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ nav.signup }}\" style=\"width:100%;background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:13px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Sign up<\u002Fbutton>\n      <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:16px 0 0;text-align:center\">Accounts are limited to verified students during the pilot.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ signupMode }}\">\n    <div>\n      <button sc-camel-on-click=\"{{ nav.login }}\" style=\"background:none;border:none;padding:0;margin:0 0 18px;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">← Back to log in<\u002Fbutton>\n      <h2 style=\"font:600 19px/1.1 'Instrument Sans',sans-serif;margin:0 0 6px\">Create your account<\u002Fh2>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 28px\">Use your institutional email — it is how we verify you belong to the campus.<\u002Fp>\n\n      <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Full name<\u002Flabel>\n      <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Priya Bhattacharya\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;color:#14201f;background:#fff;margin:0 0 18px\">\n\n      <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Institutional email<\u002Flabel>\n      <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"name@msds.christuniversity.in\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;color:#14201f;background:#fff;margin:0 0 6px\">\n      <p style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86;margin:0 0 18px\">Personal domains are not accepted during the pilot.<\u002Fp>\n\n      <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Phone number<\u002Flabel>\n      <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" placeholder=\"+91 98XXX XXXXX\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;color:#14201f;background:#fff;margin:0 0 12px\">\n\n      <div style=\"border:1px solid #cfd3cf;border-radius:12px;background:#eef4f2;padding:13px 15px;margin:0 0 24px\">\n        <p style=\"font:600 12px/1.3 'Instrument Sans',sans-serif;color:#0f5f52;margin:0 0 4px\">Your number stays private.<\u002Fp>\n        <p style=\"font:400 12px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">It is never shown on your profile, in matches or in chat. It is released only after you and the other person have both agreed to share contact details.<\u002Fp>\n      <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ sendOtp }}\" style=\"width:100%;background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:13px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Send verification code<\u002Fbutton>\n      <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:16px 0 0;text-align:center\">By continuing you agree to the matching and communication notices. You are 18 or over.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ otpSent }}\">\n    <div>\n      <button sc-camel-on-click=\"{{ backToDetails }}\" style=\"background:none;border:none;padding:0;margin:0 0 18px;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">← Back<\u002Fbutton>\n      <h2 style=\"font:600 19px/1.1 'Instrument Sans',sans-serif;margin:0 0 6px\">Enter the six-digit code<\u002Fh2>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 26px\">Sent to <strong style=\"font-weight:600;color:#14201f\">{{ emailShown }}<\u002Fstrong>. It expires in 10 minutes.<\u002Fp>\n      <div style=\"display:flex;gap:10px;margin:0 0 22px\">\n        <sc-for list=\"{{ otpBoxes }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <div style=\"{{ b.style }}\">{{ b.ch }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <input value=\"{{ otp }}\" sc-camel-on-change=\"{{ onOtp }}\" placeholder=\"Type the code\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;letter-spacing:.18em;margin:0 0 18px\">\n      <button sc-camel-on-click=\"{{ verify }}\" style=\"width:100%;background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:13px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Verify and continue<\u002Fbutton>\n      <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:16px 0 0;text-align:center\">Didn't get it? Resend in 0:42<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 2 · SEEKER TYPE -->\n<sc-if value=\"{{ is2 }}\">\n<div style=\"max-width:880px;margin:0 auto;padding:72px 32px\">\n  <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 14px\">Step 1 of 4 · Setup<\u002Fp>\n  <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0 0 8px\">Which of these is you?<\u002Fh1>\n  <p style=\"font:400 15px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 34px;max-width:620px\">This decides who you can be matched with. Two people who both already have a flat have nothing to offer each other, so Cohab will not pair them.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n    <div sc-camel-on-click=\"{{ pickNeeds }}\" style=\"{{ seekerNeedsStyle }}\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86\">needs_place<\u002Fspan>\n      <h3 style=\"font:600 18px/1.15 'Instrument Sans',sans-serif;margin:12px 0 8px\">I need a place<\u002Fh3>\n      <p style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 16px\">You are looking for both somewhere to live and someone to live with. You will be matched with other seekers and with people who have a room.<\u002Fp>\n      <p style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#63706d;margin:0\">Next: 12 questions, then your matches.<\u002Fp>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pickHas }}\" style=\"{{ seekerHasStyle }}\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86\">has_place<\u002Fspan>\n      <h3 style=\"font:600 18px/1.15 'Instrument Sans',sans-serif;margin:12px 0 8px\">I have a place and need someone<\u002Fh3>\n      <p style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 16px\">You have a room to fill. Your listing's rent, locality and available-from date replace your stated preferences when matching.<\u002Fp>\n      <p style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#63706d;margin:0\">Next: your listing, then 12 questions.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px;margin-top:32px\">\n    <button sc-camel-on-click=\"{{ seekerNext }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Continue<\u002Fbutton>\n    <span style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#7d8a86\">{{ seekerHint }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 3 · LISTING -->\n<sc-if value=\"{{ is3 }}\">\n<div style=\"max-width:1000px;margin:0 auto;padding:56px 32px\">\n  <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 14px\">Step 2 of 4 · Your listing<\u002Fp>\n  <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0 0 8px\">Describe the room you're filling<\u002Fh1>\n  <p style=\"font:400 15px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 30px;max-width:640px\">These details also act as your hard constraints — anyone outside this rent, locality or date will not be shown to you at all.<\u002Fp>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:28px 30px;margin:0 0 20px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 20px\">Location and price<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 22px\">\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Locality<\u002Flabel>\n        <input value=\"Kaggadaspura, Bengaluru\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n        <p style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86;margin:6px 0 0\">1.8 km from {{ campus }}<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Available from<\u002Flabel>\n        <input value=\"1 September 2026\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n        <p style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86;margin:6px 0 0\">Matched within a 30-day window either side.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Rent per person, monthly<\u002Flabel>\n        <input value=\"₹11,500\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Security deposit<\u002Flabel>\n        <input value=\"₹23,000\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:28px 30px;margin:0 0 20px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 18px\">The room<\u002Fh2>\n    <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Room type<\u002Flabel>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px\">\n      <sc-for list=\"{{ roomTypes }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:0 0 22px\">\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">People already living there<\u002Flabel>\n        <input value=\"1\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 7px\">Furnishing<\u002Flabel>\n        <input value=\"Semi-furnished — bed, wardrobe, desk\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.2 'Instrument Sans',sans-serif;background:#fff\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <label style=\"display:block;font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Amenities<\u002Flabel>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n      <sc-for list=\"{{ amenities }}\" as=\"a\" hint-placeholder-count=\"10\">\n        <button sc-camel-on-click=\"{{ a.pick }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:28px 30px;margin:0 0 24px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 5px\">Photos<\u002Fh2>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 18px\">Three or more, including the room itself and the shared kitchen. Listings without photos get roughly a third of the responses.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;height:210px\">\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-listing-1\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Room — drop a photo\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-listing-2\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Kitchen\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-listing-3\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Building / street\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px\">\n    <button sc-camel-on-click=\"{{ nav.q1 }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Save and continue<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.q1 }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Save as draft<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 4 · QUESTIONNAIRE, REQUIRED -->\n<sc-if value=\"{{ is4 }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:268px 1fr;gap:44px;align-items:start\">\n  <aside style=\"position:sticky;top:32px\">\n    <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 10px\">Step 3 of 4 · Required<\u002Fp>\n    <h2 style=\"font:600 18px/1.15 'Instrument Sans',sans-serif;margin:0 0 6px\">The twelve that matter<\u002Fh2>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 16px\">{{ qProgressLine }}<\u002Fp>\n    <div style=\"height:4px;border-radius:4px;background:#cfd3cf;overflow:hidden;margin:0 0 22px\">\n      <div style=\"{{ qBarStyle }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ qRail }}\" as=\"r\" hint-placeholder-count=\"12\">\n        <button sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\"><span style=\"{{ r.numStyle }}\">{{ r.num }}<\u002Fspan>{{ r.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:22px 0 0\">Answers save as you go. You can change any of them later from your profile.<\u002Fp>\n  <\u002Faside>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:18px;padding:40px 44px;min-height:520px;display:flex;flex-direction:column\">\n    <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86\">{{ qTheme }}<\u002Fspan>\n    <h1 style=\"font:600 26px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:12px 0 0;max-width:640px\">{{ qTitle }}<\u002Fh1>\n    <p style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#63706d;margin:10px 0 0;max-width:600px\">{{ qSub }}<\u002Fp>\n\n    <div style=\"margin:28px 0 0;display:flex;flex-direction:column;gap:26px\">\n      <sc-for list=\"{{ qParts }}\" as=\"p\" hint-placeholder-count=\"1\">\n        <div>\n          <p style=\"{{ p.labelStyle }}\">{{ p.label }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:9px;max-width:640px\">\n            <sc-for list=\"{{ p.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\"><span style=\"{{ o.dotStyle }}\"><\u002Fspan>{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid #cfd3cf\">\n      <button sc-camel-on-click=\"{{ qBack }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:11px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Back<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ qNext }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:11px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">{{ qNextLabel }}<\u002Fbutton>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <span style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86\">{{ qFooterNote }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 5 · QUESTIONNAIRE, OPTIONAL -->\n<sc-if value=\"{{ is5 }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:268px 1fr;gap:44px;align-items:start\">\n  <aside style=\"position:sticky;top:32px\">\n    <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 10px\">Optional · Step 3 of 4<\u002Fp>\n    <h2 style=\"font:600 18px/1.15 'Instrument Sans',sans-serif;margin:0 0 6px\">Depth, if you want it<\u002Fh2>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 18px\">These six questions carry 15% of the score. Skipping them costs you nothing — unanswered attributes are dropped from both sides, never guessed at.<\u002Fp>\n    <div style=\"display:inline-flex;align-items:center;gap:7px;border:1px solid #cfd3cf;border-radius:30px;background:#fff;padding:6px 12px;margin:0 0 20px\">\n      <span style=\"width:6px;height:6px;border-radius:6px;background:#a8442a\"><\u002Fspan>\n      <span style=\"font:500 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a\">{{ optStateLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #cfd3cf;padding-top:16px\">\n      <p style=\"font:600 12px/1.3 'Instrument Sans',sans-serif;margin:0 0 6px\">Where this is used<\u002Fp>\n      <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#63706d;margin:0\">Life stage and daily rhythm explain why two night owls can still clash. Interests and your note supply the wording on your match cards.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <sc-for list=\"{{ optQuestions }}\" as=\"q\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 4px\">\n          <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#7d8a86\">{{ q.tag }}<\u002Fspan>\n          <span style=\"font:400 11px/1 'Instrument Sans',sans-serif;color:#9aa5a1\">{{ q.tier }}<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font:600 17px/1.15 'Instrument Sans',sans-serif;margin:0 0 16px\">{{ q.title }}<\u002Fh3>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n          <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 4px\">\n        <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#7d8a86\">lifestyle_notes<\u002Fspan>\n        <span style=\"font:400 11px/1 'Instrument Sans',sans-serif;color:#9aa5a1\">Tier 3 · Affinity<\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font:600 17px/1.15 'Instrument Sans',sans-serif;margin:0 0 4px\">About you<\u002Fh3>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 14px\">What are you working towards, and what do you do outside it? What kind of home do you want to come back to?<\u002Fp>\n      <textarea value=\"{{ notes }}\" sc-camel-on-change=\"{{ onNotes }}\" placeholder=\"Second-year MSc, mostly on campus till 7. I cook on weekends and I like a quiet flat on weeknights…\" style=\"width:100%;box-sizing:border-box;min-height:110px;resize:vertical;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f\"><\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;padding:4px 0 0\">\n      <button sc-camel-on-click=\"{{ nav.weights }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Save and continue<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ skipOptional }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Skip for now<\u002Fbutton>\n      <span style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86\">You can come back to this from your profile at any time.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 6 · IMPORTANCE WEIGHTING -->\n<sc-if value=\"{{ is6 }}\">\n<div style=\"max-width:1000px;margin:0 auto;padding:56px 32px\">\n  <p style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86;margin:0 0 14px\">Step 4 of 4 · Priorities<\u002Fp>\n  <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0 0 8px\">Pick the three that matter most to you<\u002Fh1>\n  <p style=\"font:400 15px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 8px;max-width:660px\">Your three are weighted more heavily when Cohab scores candidates for you. Everyone weights these differently, which is why your ranking and theirs are not the same list.<\u002Fp>\n  <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#7d8a86;margin:0 0 26px\">{{ weightCount }}<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n    <sc-for list=\"{{ weightTiles }}\" as=\"w\" hint-placeholder-count=\"12\">\n      <button sc-camel-on-click=\"{{ w.pick }}\" style=\"{{ w.style }}\">\n        <span style=\"{{ w.rankStyle }}\">{{ w.rank }}<\u002Fspan>\n        <span style=\"font:600 15px/1.2 'Instrument Sans',sans-serif;display:block;margin:0 0 5px\">{{ w.title }}<\u002Fspan>\n        <span style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#63706d;display:block\">{{ w.sub }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px;margin-top:28px\">\n    <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">See my matches<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:none;border:none;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">Skip — use the platform defaults<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 7 · MATCH LIST -->\n<sc-if value=\"{{ is7 }}\">\n<div style=\"max-width:1360px;margin:0 auto;padding:28px 32px;display:grid;grid-template-columns:262px 1fr;gap:32px;align-items:start\">\n  <aside style=\"position:sticky;top:88px;background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:20px 20px 22px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px\">\n      <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0\">Filters<\u002Fh2>\n      <button style=\"background:none;border:none;padding:0;font:500 12px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">Reset<\u002Fbutton>\n    <\u002Fdiv>\n\n    <p style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Monthly rent<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:8px;margin:0 0 20px\">\n      <input value=\"₹8,000\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:10px;padding:9px 10px;font:400 13px/1.2 'Instrument Sans',sans-serif\">\n      <span style=\"color:#9aa5a1\">–<\u002Fspan>\n      <input value=\"₹14,000\" style=\"width:100%;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:10px;padding:9px 10px;font:400 13px/1.2 'Instrument Sans',sans-serif\">\n    <\u002Fdiv>\n\n    <p style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Locality<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:7px;margin:0 0 20px\">\n      <sc-for list=\"{{ localityFilters }}\" as=\"l\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ l.pick }}\" style=\"{{ l.style }}\"><span style=\"{{ l.boxStyle }}\"><\u002Fspan><span style=\"flex:1;text-align:left\">{{ l.label }}<\u002Fspan><span style=\"font:400 12px/1 'Instrument Sans',sans-serif;color:#9aa5a1\">{{ l.count }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Room type<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px\">\n      <sc-for list=\"{{ roomFilters }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Move-in window<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px\">\n      <sc-for list=\"{{ dateFilters }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ d.pick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"font:600 12px/1 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 9px\">Who they are<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px\">\n      <sc-for list=\"{{ typeFilters }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid #cfd3cf;padding-top:14px\">\n      <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:0\">Gender preference is applied as a hard filter and cannot be changed here. 31 candidates were excluded by your filters.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 6px\">\n      <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0\">{{ matchCountLine }}<\u002Fh1>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"font:400 13px/1 'Instrument Sans',sans-serif;color:#63706d\">Sort<\u002Fspan>\n        <sc-for list=\"{{ sorts }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font:400 13.5px/1.5 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 20px;max-width:720px\">Ranked by compatibility computed in both directions. Every card shows the three strongest agreements and the single largest difference. A score is not a recommendation to move in — it is a shortlist.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ matches }}\" as=\"m\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ m.open }}\" style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:18px;display:grid;grid-template-columns:186px 1fr 150px;gap:20px;cursor:pointer;box-shadow:0 1px 2px rgba(20,32,31,.03)\">\n          <div style=\"position:relative;height:150px;min-width:0;border-radius:12px;overflow:hidden\">\n            <image-slot id=\"{{ m.slotId }}\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"{{ m.slotHint }}\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"min-width:0;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin:0 0 3px\">\n              <h3 style=\"font:600 18px/1.15 'Instrument Sans',sans-serif;margin:0\">{{ m.name }}<\u002Fh3>\n              <span style=\"{{ m.verifiedStyle }}\">Verified<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 10px\">{{ m.meta }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px\">\n              <sc-for list=\"{{ m.agreements }}\" as=\"a\" hint-placeholder-count=\"3\">\n                <span style=\"border:1px solid #cfd3cf;border-radius:4px;background:#eef4f2;padding:5px 8px;font:500 12px/1.2 'Instrument Sans',sans-serif;color:#0f5f52\">{{ a }}<\u002Fspan>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ showDivergence }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"border:1px solid #a8442a;border-radius:4px;background:#fff;padding:5px 8px;font:500 12px/1.2 'Instrument Sans',sans-serif;color:#a8442a\">{{ m.divergence }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">{{ m.line }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #cfd3cf;padding-left:18px;display:flex;flex-direction:column\">\n            <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">Compatibility<\u002Fspan>\n            <span style=\"font:600 27px/1.15 'Instrument Sans',sans-serif;letter-spacing:-.02em;margin:6px 0 8px\">{{ m.score }}<\u002Fspan>\n            <div style=\"height:3px;background:#cfd3cf;border-radius:3px;overflow:hidden;margin:0 0 14px\"><div style=\"{{ m.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">{{ m.priceLabel }}<\u002Fspan>\n            <span style=\"font:600 17px/1.2 'Instrument Sans',sans-serif;margin:5px 0 2px\">{{ m.price }}<\u002Fspan>\n            <span style=\"font:400 12px/1.35 'Instrument Sans',sans-serif;color:#63706d\">{{ m.priceSub }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 8 · MATCH DETAIL -->\n<sc-if value=\"{{ is8 }}\">\n<div style=\"max-width:940px;margin:0 auto;padding:28px 32px 60px\">\n  <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:none;border:none;padding:0;margin:0 0 22px;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">← All matches<\u002Fbutton>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:18px;padding:30px 32px;margin:0 0 18px\">\n    <div style=\"display:flex;align-items:flex-start;gap:24px\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 4px\">\n          <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0\">{{ d.name }}<\u002Fh1>\n          <span style=\"border:1px solid #0f5f52;border-radius:30px;padding:4px 10px;font:500 11px/1 'Instrument Sans',sans-serif;color:#0f5f52;background:#eef4f2\">Verified · Institutional email<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 14px\">{{ d.meta }}<\u002Fp>\n        <p style=\"font:400 14px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0;max-width:520px\">{{ d.notes }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"width:210px;flex:none;border-left:1px solid #cfd3cf;padding-left:22px\">\n        <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">Combined score<\u002Fspan>\n        <div style=\"font:600 38px/1.05 'Instrument Sans',sans-serif;letter-spacing:-.025em;margin:8px 0 10px\">{{ d.score }}<\u002Fdiv>\n        <p style=\"font:400 12px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 16px\">Harmonic mean of {{ d.sab }} (you → her) and {{ d.sba }} (her → you), under weight set v2.<\u002Fp>\n        <button sc-camel-on-click=\"{{ expressInterest }}\" style=\"{{ interestStyle }}\">{{ interestLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"width:100%;background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:11px 18px;font:600 13px/1 'Instrument Sans',sans-serif;cursor:pointer;margin-top:8px\">Open chat<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:18px;padding:26px 30px;margin:0 0 18px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px\">\n      <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0\">Her listing<\u002Fh2>\n      <span style=\"font:400 13px/1 'Instrument Sans',sans-serif;color:#63706d\">Kaggadaspura · 1.8 km from campus<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 18px\">Rent and dates below are the values used as your hard constraints — not a preference she stated.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;height:180px;margin:0 0 20px\">\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-detail-1\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Room\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-detail-2\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Kitchen\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"min-width:0;min-height:0;overflow:hidden;border-radius:12px\"><image-slot id=\"cohab-detail-3\" radius=\"12\" style=\"display:block;width:100%;height:100%\" placeholder=\"Living area\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#cfd3cf;border:1px solid #cfd3cf;border-radius:12px;overflow:hidden\">\n      <sc-for list=\"{{ listingFacts }}\" as=\"f\" hint-placeholder-count=\"8\">\n        <div style=\"background:#fff;padding:13px 15px\">\n          <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">{{ f.k }}<\u002Fspan>\n          <p style=\"font:600 14px/1.3 'Instrument Sans',sans-serif;margin:7px 0 0\">{{ f.v }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:16px 0 0\"><strong style=\"font-weight:600\">House rules.<\u002Fstrong> No smoking indoors. Guests with a day's notice. Cleaning help twice a week, ₹600 each.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:18px;padding:26px 30px;margin:0 0 18px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 6px\">Attribute breakdown<\u002Fh2>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 20px\">Tolerance attributes score differently in each direction — the arrow shows which way the difference runs.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:150px 1fr 1fr 128px;gap:10px;padding:0 0 9px;border-bottom:1px solid #cfd3cf\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">Attribute<\u002Fspan>\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">You<\u002Fspan>\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">{{ d.first }}<\u002Fspan>\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86;text-align:right\">Score<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ breakdown }}\" as=\"b\" hint-placeholder-count=\"10\">\n      <div style=\"display:grid;grid-template-columns:150px 1fr 1fr 128px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e3e1dc\">\n        <div>\n          <span style=\"font:600 13.5px/1.25 'Instrument Sans',sans-serif;display:block\">{{ b.attr }}<\u002Fspan>\n          <span style=\"font:400 10.5px/1.2 ui-monospace,Menlo,monospace;color:#9aa5a1\">{{ b.type }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font:400 13.5px/1.35 'Instrument Sans',sans-serif;color:#3f4d4a\">{{ b.you }}<\u002Fspan>\n        <span style=\"font:400 13.5px/1.35 'Instrument Sans',sans-serif;color:#3f4d4a\">{{ b.them }}<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:9px;justify-content:flex-end\">\n          <div style=\"width:66px;height:4px;border-radius:4px;background:#e3e1dc;overflow:hidden\"><div style=\"{{ b.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"{{ b.numStyle }}\">{{ b.score }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:flex;gap:12px;align-items:flex-start;margin-top:18px;border:1px solid #a8442a;border-radius:12px;padding:14px 16px\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#a8442a;margin-top:2px\">Divergence<\u002Fspan>\n      <p style=\"font:400 13.5px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">{{ d.divergence }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:16px\">\n    <button sc-camel-on-click=\"{{ nav.report }}\" style=\"background:none;border:none;padding:0;font:500 13px/1 'Instrument Sans',sans-serif;color:#a8442a;cursor:pointer\">Report this profile<\u002Fbutton>\n    <span style=\"color:#cfd3cf\">·<\u002Fspan>\n    <button style=\"background:none;border:none;padding:0;font:500 13px/1 'Instrument Sans',sans-serif;color:#63706d;cursor:pointer\">Block and hide from my matches<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 9 · CHAT -->\n<sc-if value=\"{{ is9 }}\">\n<div style=\"max-width:1360px;margin:0 auto;padding:24px 32px\">\n  <div style=\"display:grid;grid-template-columns:320px 1fr;background:#fff;border:1px solid #cfd3cf;border-radius:18px;overflow:hidden;height:calc(100vh - 170px);min-height:560px\">\n    <div style=\"border-right:1px solid #cfd3cf;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"padding:18px 20px 14px;border-bottom:1px solid #cfd3cf\">\n        <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 8px\">Chats<\u002Fh2>\n        <p style=\"font:400 12px/1.45 'Instrument Sans',sans-serif;color:#7d8a86;margin:0\">Threads open only after both of you express interest.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"overflow:auto;flex:1\">\n        <sc-for list=\"{{ threads }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">\n            <div style=\"width:38px;height:38px;border-radius:38px;background:#eef4f2;border:1px solid #cfd3cf;color:#0f5f52;font:600 13px/36px 'Instrument Sans',sans-serif;text-align:center;flex:none\">{{ t.initials }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0;text-align:left\">\n              <div style=\"display:flex;align-items:baseline;gap:8px\">\n                <span style=\"font:600 14px/1.2 'Instrument Sans',sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.name }}<\u002Fspan>\n                <span style=\"font:400 11px/1 'Instrument Sans',sans-serif;color:#9aa5a1\">{{ t.time }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#63706d;margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.snippet }}<\u002Fp>\n            <\u002Fdiv>\n            <span style=\"{{ t.dotStyle }}\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #cfd3cf;padding:14px 20px\">\n        <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:0\">Messages are stored encrypted but readable by moderators when a report is filed. They are not end-to-end encrypted.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <div style=\"padding:15px 24px;border-bottom:1px solid #cfd3cf;display:flex;align-items:center;gap:12px\">\n        <div style=\"width:34px;height:34px;border-radius:34px;background:#eef4f2;border:1px solid #cfd3cf;color:#0f5f52;font:600 12px/32px 'Instrument Sans',sans-serif;text-align:center\">MS<\u002Fdiv>\n        <div style=\"flex:1\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"font:600 15px/1.2 'Instrument Sans',sans-serif\">Meghna S.<\u002Fspan>\n            <span style=\"border:1px solid #cfd3cf;border-radius:30px;padding:3px 9px;font:500 11px/1 'Instrument Sans',sans-serif;color:#0f5f52;background:#eef4f2\">Mutual match · 87<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font:400 12px/1.3 'Instrument Sans',sans-serif;color:#7d8a86;margin:3px 0 0\">Kaggadaspura · ₹11,500 · available 1 Sept<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nav.detail }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:10px;padding:8px 14px;font:500 12.5px/1 'Instrument Sans',sans-serif;cursor:pointer\">View match<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.contact }}\" style=\"background:#fff;color:#0f5f52;border:1px solid #0f5f52;border-radius:10px;padding:8px 14px;font:600 12.5px/1 'Instrument Sans',sans-serif;cursor:pointer\">Share contact<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.report }}\" style=\"background:none;border:none;padding:6px;font:500 12.5px/1 'Instrument Sans',sans-serif;color:#a8442a;cursor:pointer\">Report<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow:auto;padding:22px 24px;background:#eceae5;min-height:0\">\n        <p style=\"text-align:center;font:400 11.5px/1 'Instrument Sans',sans-serif;color:#7d8a86;margin:0 0 18px\">Thread opened 14 August · Contact details are hidden until you both agree to share them<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div style=\"{{ m.rowStyle }}\">\n              <div style=\"{{ m.bubbleStyle }}\">{{ m.text }}<\u002Fdiv>\n              <span style=\"{{ m.metaStyle }}\">{{ m.meta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #cfd3cf;padding:14px 24px 16px;background:#fff\">\n        <sc-if value=\"{{ piiWarning }}\">\n          <div style=\"border:1.5px solid #a8442a;border-radius:12px;padding:14px 16px;margin:0 0 12px;display:flex;gap:14px;align-items:flex-start\">\n            <div style=\"flex:1\">\n              <p style=\"font:600 13px/1.3 'Instrument Sans',sans-serif;color:#a8442a;margin:0 0 4px\">{{ piiTitle }}<\u002Fp>\n              <p style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">Contact details stay off chat until you both agree to share them. Sharing them here removes that protection and cannot be undone.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;flex:none\">\n              <button sc-camel-on-click=\"{{ nav.contact }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:10px;padding:9px 14px;font:600 12.5px/1 'Instrument Sans',sans-serif;cursor:pointer;white-space:nowrap\">Share Contact instead<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearDraft }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:10px;padding:9px 14px;font:500 12.5px/1 'Instrument Sans',sans-serif;cursor:pointer;white-space:nowrap\">Edit message<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;align-items:flex-end\">\n          <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" placeholder=\"Message Meghna…\" style=\"{{ draftStyle }}\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ send }}\" style=\"{{ sendStyle }}\">Send<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font:400 11.5px/1.4 'Instrument Sans',sans-serif;color:#7d8a86;margin:9px 0 0\">Try typing a phone number or an email address to see the check. Abusive content is flagged for moderator review, not blocked.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 10 · CONTACT SHARE -->\n<sc-if value=\"{{ is10 }}\">\n<div style=\"max-width:760px;margin:0 auto;padding:36px 32px 60px\">\n  <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"background:none;border:none;padding:0;margin:0 0 20px;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">← Back to chat<\u002Fbutton>\n  <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0 0 8px\">Share contact details with Meghna<\u002Fh1>\n  <p style=\"font:400 15px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 26px\">Nothing is released until both of you have agreed. Either of you can withdraw before the other consents. Once shared, it cannot be taken back.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px\">\n    <div style=\"{{ consentYouStyle }}\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">You<\u002Fspan>\n      <p style=\"font:600 15px/1.25 'Instrument Sans',sans-serif;margin:11px 0 6px\">{{ consentYouTitle }}<\u002Fp>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">Phone number and preferred contact time. Your address is never shared by Cohab.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:20px 22px\">\n      <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">Meghna<\u002Fspan>\n      <p style=\"font:600 15px/1.25 'Instrument Sans',sans-serif;margin:11px 0 6px\">Has not agreed yet<\u002Fp>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">She will be asked once you agree. She has not been told that you opened this screen.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px;margin:0 0 20px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 14px\">Before you meet in person<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:11px\">\n      <sc-for list=\"{{ safety }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;gap:11px;align-items:flex-start\">\n          <span style=\"width:5px;height:5px;border-radius:5px;background:#0f5f52;margin-top:8px;flex:none\"><\u002Fspan>\n          <p style=\"font:400 14px/1.5 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">{{ s }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px\">\n    <button sc-camel-on-click=\"{{ toggleConsent }}\" style=\"{{ consentBtnStyle }}\">{{ consentBtnLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Keep talking in chat<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:16px 0 0;max-width:600px\">{{ consentFoot }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 11 · REPORT -->\n<sc-if value=\"{{ is11 }}\">\n<div style=\"max-width:680px;margin:0 auto;padding:36px 32px 60px\">\n  <sc-if value=\"{{ reportOpen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"background:none;border:none;padding:0;margin:0 0 20px;font:500 13px/1 'Instrument Sans',sans-serif;color:#0f5f52;cursor:pointer\">← Cancel<\u002Fbutton>\n    <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:0 0 8px\">Report Meghna S.<\u002Fh1>\n    <p style=\"font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 26px\">A moderator reviews every report before any action is taken. The account is not suspended while a report is open, except for threats or harassment, which escalate immediately.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px;margin:0 0 16px\">\n      <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 14px\">What happened?<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <sc-for list=\"{{ reasons }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">\n            <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n            <span style=\"text-align:left\">\n              <span style=\"font:600 14px/1.25 'Instrument Sans',sans-serif;display:block\">{{ r.label }}<\u002Fspan>\n              <span style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#63706d;display:block;margin-top:3px\">{{ r.sub }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px;margin:0 0 20px\">\n      <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 5px\">Details<\u002Fh2>\n      <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 14px\">Dates and what was said help. The chat thread is attached automatically as evidence.<\u002Fp>\n      <textarea value=\"{{ reportText }}\" sc-camel-on-change=\"{{ onReportText }}\" placeholder=\"What happened, and when…\" style=\"width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:1px solid #cfd3cf;border-radius:12px;padding:12px 14px;font:400 14px/1.5 'Instrument Sans',sans-serif;color:#14201f\"><\u002Ftextarea>\n      <label style=\"display:flex;align-items:center;gap:9px;margin:14px 0 0;font:400 13.5px/1.4 'Instrument Sans',sans-serif;color:#3f4d4a\"><input type=\"checkbox\" style=\"width:15px;height:15px;accent-color:#0f5f52\">Also block Meghna — she will be removed from your matches and the thread hidden.<\u002Flabel>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <button sc-camel-on-click=\"{{ submitReport }}\" style=\"background:#a8442a;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Submit report<\u002Fbutton>\n      <span style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#7d8a86\">Reviewed within 24 hours.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ reportSent }}\">\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:18px;padding:34px 36px\">\n    <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#0f5f52\">Report R-2481 · Open<\u002Fspan>\n    <h1 style=\"font:600 24px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:14px 0 10px\">Thanks — a moderator has it<\u002Fh1>\n    <p style=\"font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 18px\">You will hear the outcome by email within 24 hours, whether or not action is taken. Meghna is not told who filed the report.<\u002Fp>\n    <div style=\"border-top:1px solid #cfd3cf;padding-top:16px;margin:0 0 22px\">\n      <p style=\"font:400 13.5px/1.5 'Instrument Sans',sans-serif;color:#63706d;margin:0\">The chat thread from 14 August has been attached. If you added a block, she has already been removed from your matches.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px\">\n      <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:11px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Back to matches<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetReport }}\" style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:12px;padding:11px 20px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">File another report<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 12 · OUTCOME FEEDBACK -->\n<sc-if value=\"{{ is12 }}\">\n<div style=\"max-width:640px;margin:0 auto;padding:56px 32px 60px\">\n  <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7d8a86\">30-day check-in<\u002Fspan>\n  <h1 style=\"font:600 26px/1.18 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin:14px 0 8px\">You moved in with Meghna a month ago<\u002Fh1>\n  <p style=\"font:400 15px/1.55 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0 0 28px\">Two questions. Your answers are not shown to Meghna, and they are what teach the matching where it was wrong.<\u002Fp>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px;margin:0 0 14px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 16px\">Are you still living together?<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n      <sc-for list=\"{{ fbStill }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:24px 26px;margin:0 0 20px\">\n    <h2 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 5px\">What has been the biggest friction, if any?<\u002Fh2>\n    <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 16px\">Pick one. This is the answer that moves the weights.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n      <sc-for list=\"{{ fbFriction }}\" as=\"o\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px\">\n    <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:12px 22px;font:600 14px/1 'Instrument Sans',sans-serif;cursor:pointer\">Submit<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.matches }}\" style=\"background:none;border:none;font:500 13px/1 'Instrument Sans',sans-serif;color:#63706d;cursor:pointer\">Ask me at 90 days instead<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 13 · MODERATOR QUEUE -->\n<sc-if value=\"{{ is13 }}\">\n<div style=\"min-height:100vh;background:#eceae5\">\n  <header style=\"background:#14201f;border-bottom:1px solid #14201f\">\n    <div style=\"max-width:1560px;margin:0 auto;padding:0 28px;height:54px;display:flex;align-items:center;gap:22px\">\n      <span style=\"font:700 16px/1 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:#fff\">Cohab<\u002Fspan>\n      <span style=\"font:500 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#eceae5;border:1px solid #4a5654;border-radius:3px;padding:3px 5px\">Moderation<\u002Fspan>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <span style=\"font:400 12px/1 'Instrument Sans',sans-serif;color:#b6c0bd\">SLA breach in 2 · Open 4 · Median claim time 3h 10m<\u002Fspan>\n      <div style=\"width:26px;height:26px;border-radius:26px;background:#0f5f52;color:#fff;font:600 11px/26px 'Instrument Sans',sans-serif;text-align:center\">SP<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1560px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;overflow:hidden\">\n      <div style=\"padding:16px 20px;border-bottom:1px solid #cfd3cf;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <h1 style=\"font:600 18px/1.1 'Instrument Sans',sans-serif;margin:0;margin-right:6px\">Report queue<\u002Fh1>\n        <sc-for list=\"{{ modFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <input placeholder=\"Search reports, users, IDs\" style=\"width:210px;box-sizing:border-box;border:1px solid #cfd3cf;border-radius:10px;padding:8px 11px;font:400 12.5px/1.2 'Instrument Sans',sans-serif\">\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(180px,1.3fr) minmax(140px,1fr) 106px 74px;gap:10px;padding:9px 20px;border-bottom:1px solid #cfd3cf;background:#f5f4f0\">\n        <sc-for list=\"{{ modCols }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86;cursor:pointer\">{{ c }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ modRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">\n          <span style=\"font:500 11.5px/1.2 ui-monospace,Menlo,monospace;color:#3f4d4a\">{{ r.id }}<\u002Fspan>\n          <div style=\"min-width:0\">\n            <span style=\"font:600 13.5px/1.25 'Instrument Sans',sans-serif;display:block\">{{ r.subject }}<\u002Fspan>\n            <span style=\"font:400 12px/1.3 'Instrument Sans',sans-serif;color:#7d8a86\">{{ r.reporter }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font:400 13px/1.35 'Instrument Sans',sans-serif;color:#3f4d4a\">{{ r.reason }}<\u002Fspan>\n          <span style=\"{{ r.stateStyle }}\">{{ r.state }}<\u002Fspan>\n          <span style=\"font:400 12.5px/1.3 'Instrument Sans',sans-serif;color:#7d8a86;text-align:right\">{{ r.age }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:13px 20px;border-top:1px solid #cfd3cf\">\n        <p style=\"font:400 12px/1.5 'Instrument Sans',sans-serif;color:#7d8a86;margin:0\">Three or more independent reports against one account trigger automatic temporary suspension. Repeat reports by the same user collapse into one case.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:22px 24px\">\n        <div style=\"display:flex;align-items:flex-start;gap:14px;margin:0 0 16px\">\n          <div style=\"flex:1\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin:0 0 5px\">\n              <h2 style=\"font:600 19px/1.1 'Instrument Sans',sans-serif;margin:0\">{{ mod.subject }}<\u002Fh2>\n              <span style=\"{{ mod.stateStyle }}\">{{ mod.state }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font:400 13px/1.4 'Instrument Sans',sans-serif;color:#63706d;margin:0\">{{ mod.meta }}<\u002Fp>\n          <\u002Fdiv>\n          <button style=\"background:#fff;color:#14201f;border:1px solid #cfd3cf;border-radius:10px;padding:9px 14px;font:600 12.5px/1 'Instrument Sans',sans-serif;cursor:pointer;flex:none\">Claim case<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#cfd3cf;border:1px solid #cfd3cf;border-radius:12px;overflow:hidden\">\n          <sc-for list=\"{{ mod.facts }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;padding:11px 14px\">\n              <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7d8a86\">{{ f.k }}<\u002Fspan>\n              <p style=\"font:600 13.5px/1.3 'Instrument Sans',sans-serif;margin:6px 0 0\">{{ f.v }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:22px 24px\">\n        <h3 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 4px\">Evidence<\u002Fh3>\n        <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 16px\">{{ mod.evidenceNote }}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ mod.evidence }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div style=\"{{ e.style }}\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 5px\">\n                <span style=\"font:600 12.5px/1 'Instrument Sans',sans-serif\">{{ e.who }}<\u002Fspan>\n                <span style=\"font:400 11.5px/1 ui-monospace,Menlo,monospace;color:#7d8a86\">{{ e.at }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font:400 13.5px/1.45 'Instrument Sans',sans-serif;color:#3f4d4a;margin:0\">{{ e.text }}<\u002Fp>\n              <span style=\"{{ e.flagStyle }}\">{{ e.flag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:22px 24px\">\n        <h3 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 4px\">Decision<\u002Fh3>\n        <p style=\"font:400 13px/1.45 'Instrument Sans',sans-serif;color:#63706d;margin:0 0 16px\">Finding and sanction are recorded separately. Both are written to the audit log with your moderator ID.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px\">\n          <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ d.pick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <textarea placeholder=\"Reasoning shown to neither party, retained for audit…\" style=\"width:100%;box-sizing:border-box;min-height:74px;resize:vertical;border:1px solid #cfd3cf;border-radius:12px;padding:11px 13px;font:400 13.5px/1.5 'Instrument Sans',sans-serif;margin:0 0 14px\"><\u002Ftextarea>\n        <div style=\"display:flex;align-items:center;gap:11px\">\n          <button sc-camel-on-click=\"{{ recordDecision }}\" style=\"background:#0f5f52;color:#fff;border:none;border-radius:12px;padding:11px 20px;font:600 13.5px/1 'Instrument Sans',sans-serif;cursor:pointer\">Record decision<\u002Fbutton>\n          <button style=\"background:#fff;color:#a8442a;border:1px solid #a8442a;border-radius:12px;padding:11px 20px;font:600 13.5px/1 'Instrument Sans',sans-serif;cursor:pointer\">Escalate<\u002Fbutton>\n          <span style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#7d8a86\">{{ decisionHint }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #cfd3cf;border-radius:16px;padding:22px 24px\">\n        <h3 style=\"font:600 17px/1.1 'Instrument Sans',sans-serif;margin:0 0 14px\">Action log<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <sc-for list=\"{{ modLog }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:128px 1fr;gap:14px;padding:10px 0;border-top:1px solid #e3e1dc\">\n              <span style=\"font:400 11.5px/1.4 ui-monospace,Menlo,monospace;color:#7d8a86\">{{ l.at }}<\u002Fspan>\n              <div>\n                <span style=\"font:600 13px/1.3 'Instrument Sans',sans-serif;display:block\">{{ l.what }}<\u002Fspan>\n                <span style=\"font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:#63706d\">{{ l.who }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- PROTOTYPE SCREEN SWITCHER -->\n<div style=\"position:fixed;left:0;right:0;bottom:0;z-index:60;background:#14201f;border-top:1px solid #14201f\">\n  <div style=\"max-width:1560px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:12px\">\n    <span style=\"font:500 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#8d9996;flex:none\">Prototype · 14 screens<\u002Fspan>\n    <div style=\"display:flex;gap:5px;flex-wrap:wrap;flex:1\">\n      <sc-for list=\"{{ switcher }}\" as=\"s\" hint-placeholder-count=\"13\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\"><span style=\"opacity:.55;margin-right:6px\">{{ s.num }}<\u002Fspan>{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980},&quot;campus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Christ University, Central Campus&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showDivergence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Match cards&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;login&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;signup&quot;,&quot;seeker&quot;,&quot;listing&quot;,&quot;q1&quot;,&quot;q2&quot;,&quot;weights&quot;,&quot;matches&quot;,&quot;detail&quot;,&quot;chat&quot;,&quot;contact&quot;,&quot;report&quot;,&quot;feedback&quot;,&quot;mod&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: this.props.startScreen || 'login',\n    otpSent: false, name: '', email: '', phone: '', otp: '', password: '',\n    seeker: null, roomType: 'private',\n    amenities: { 'Wi-Fi': 1, 'Washing machine': 1, 'Fridge': 1, 'Geyser': 1, 'Power backup': 1 },\n    qi: 0, answers: { sleep: 'regular', noise_pref: 'moderate', noise_behav: 'quiet', clean: 'very_tidy' },\n    optAnswers: { life_stage: 'coursework' }, optSk , ['moderate', 'Normal — occasional calls or music'], ['loud', 'Music, calls, friends over']] }] },\n    { theme: 'Cleanliness', title: 'How tidy do you keep shared spaces?', sub: 'The most frequently reported source of roommate conflict, at roughly 42%.', parts: [{ key: 'clean', label: null, o: [['very_tidy', 'Cleaned daily, everything put away'], ['moderate', 'Tidy up every few days'], ['relaxed', 'Clean when it needs it']] }] },\n    { theme: 'Chores', title: 'How should the cleaning get done?', sub: 'Asked separately from tidiness — two people can share a standard and still fight about who does the work.', parts: [{ key: 'chore', label: null, o: [['rota', 'Fixed rota, everyone knows their job'], ['shared', 'Share fairly, no formal schedule'], ['hired', 'Hire help and split the cost'], ['own_mess', 'Everyone cleans up after themselves only']] }] },\n    { theme: 'Sharing', title: 'How do you treat things in a shared flat?', sub: 'Food and belongings account for around 27% of disputes, and it is independent of tidiness — someone can follow the rota perfectly and still finish your milk.', parts: [{ key: 'sharing', label: null, o: [['communal', 'Mostly shared — help yourself'], ['ask_first', 'Ask before using my things'], ['separate', 'I keep my things separate']] }] },\n    { theme: 'Guests', title: 'How often do you have guests over?', sub: null, parts: [{ key: 'guest_freq', label: null, o: [['rarely', 'Rarely'], ['occasionally', 'A few times a month'], ['often', 'Weekly or more'], ['partner_regular', 'A partner stays over regularly']] }] },\n    { theme: 'Guests', title: \"How do you feel about a roommate's guests?\", sub: 'This and the last question form a pair. What matters is their frequency against your comfort, not whether your habits look alike.', parts: [{ key: 'guest_tol', label: null, o: [['anytime', 'Fine anytime'], ['with_notice', 'Fine with notice'], ['weekends', 'Weekends only'], ['prefer_none', \"I'd rather not\"]] }] },\n    { theme: 'Communication
