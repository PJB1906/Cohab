name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: cohab
          POSTGRES_PASSWORD: cohab
          POSTGRES_DB: cohab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohab" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cohab:cohab@localhost:5432/cohab
      SECRET_KEY: ci-only
      COOKIE_SECURE: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: alembic upgrade head
      - name: Seed (several API tests read the seeded pool)
        run: python -m cohab.seed && python -m cohab.demo_seed
      - run: python -m pytest -q
      - name: Migrations round-trip
        run: alembic downgrade -1 && alembic upgrade head

  runtime-deps:
    # Installs exactly what the Docker image installs (no test packages) and
    # imports the app. Catches a runtime import that only test tooling was
    # providing (D-14.21: httpx).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import cohab.main, cohab.analysis.reproduce; print('runtime imports ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
