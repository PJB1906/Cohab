<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- href is rewritten by the theme script below (and by lib/theme.ts on
         every later theme change). Defaults to light so a browser with JS
         disabled still gets a real icon rather than a 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="Cohab: find a roommate you can actually live with. Verified students, honest compatibility, contact shared only when you both agree." />
    <title>Cohab — find the one you can live with</title>
    <!-- Resolve the theme before first paint (docs/DECISIONS.md D-13.12).
         Inline and synchronous on purpose: deferring this to React would
         paint the default dark theme first and then swap, which is the
         flash-of-wrong-theme every themed app has to design around. Kept
         deliberately tiny and dependency-free; `lib/theme.ts` owns the same
         logic for everything after mount. -->
    <script>
      (function () {
        try {
          // No stored choice yet: open light rather than following the OS
          // (matches lib/theme.ts's getStoredChoice default).
          var choice = localStorage.getItem('cohab-theme') || 'light'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          // Same swap lib/theme.ts does after mount, done here so the tab
          // never shows the wrong-palette icon first (D-13.17).
          var icon = document.querySelector('link[rel="icon"]')
          if (icon) icon.href = dark ? '/favicon-dark.svg' : '/favicon-light.svg'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
